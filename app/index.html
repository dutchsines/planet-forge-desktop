// ------------------------------------------------------------------ biomes

// ------------------------------------------------------------------ clouds & weather
vec3 stormWarp(vec3 p, vec4 st) {
  float d2 = 2.0 * (1.0 - clamp(dot(p, st.xyz), -1.0, 1.0));       // squared angular distance, smooth everywhere
  float k = st.w * exp(-d2 / 0.026) * 3.2;

  return p * cos(k) + cross(a, p) * sin(k) + a * dot(a, p) * (1.0 - cos(k));
}
float stormMask(vec3 p, vec4 st) {
  float d2 = 2.0 * (1.0 - clamp(dot(p, st.xyz), -1.0, 1.0));
  return abs(st.w) * exp(-d2 / 0.038);
}

  float d2 = 2.0 * (1.0 - clamp(dot(p, st.xyz), -1.0, 1.0)), w = abs(st.w), m = w * exp(-d2 / 0.038);
  if (m < 0.005) return 0.0;

  float th = atan(dot(p, e2), dot(p, e1)), r = sqrt(d2), hand = a.y >= 0.0 ? 1.0 : -1.0;

  float sp2 = 0.5 + 0.5 * sin(th * 3.0 * hand + log(r + 0.03) * 11.0 + 1.3), outer = exp(-pow((r - 0.11) / 0.05, 2.0)) * smoothstep(0.35, 0.8, w) * smoothstep(0.55, 0.85, sp2);      // outer rain bands
  float asym = 0.82 + 0.18 * cos(th - 0.8);                         // stronger on one flank, like a real storm moving through shear

}
float wxMask(vec3 p, int i) {

float jetMend(vec3 dir) {                       // the jet streams are Rossby waves: they wobble north and south, and the wave pattern slowly changes (3 lobes, 4 lobes, mixtures)

  float a = asin(clamp(abs(dir.y), 0.0, 1.0)) + jetMend(dir), js = 0.7 + 0.3 * sin(uCloudPh * 0.17 + 0.5), c1 = 0.86 + 0.05 * sin(uCloudPh * 0.12), c2 = 0.52 + 0.03 * sin(uCloudPh * 0.10 + 1.0), u = (a - c1) / 0.15, v = (a - c2) / 0.12;

}
float cloudDensity(vec3 dir, float octf) {      // dir: unit vector in the planet frame, +Y = north pole
  float lat = dir.y;
  vec3 p = stormWarp(dir, uStorm0);
  p = stormWarp(p, uStorm1);
  p = stormWarp(p, uStorm2);
  for (int i = 0; i < NC; i++) {                               // impact shockwave: the cloud deck is shoved outward from fresh impacts
    float ir = uCr[i].w, ia = uCrP[i].w;
    if (ir > 0.0 && ia >= 0.0 && ia < 14.0) {
      float cd = dot(dir, uCr[i].xyz);
      if (cd > 0.2) {
        float d = sqrt(max(0.0, 2.0 * (1.0 - cd))), sz = clamp(ir / 0.07, 0.25, 1.2), rr = ia * 0.10 * (1.0 + 4.0 * ir), wd = 0.03 + 0.25 * ir;
        vec3 away = dir - uCr[i].xyz * cd; float al = length(away);
        if (al > 1e-4) p = normalize(p - away / al * exp(-pow((d - rr) / (2.0 * wd), 2.0)) * 0.35 * sz * exp(-ia * 0.2));

    }
  }
  float alw = asin(clamp(abs(lat), 0.0, 1.0)), prof = -sin(alw * 5.6);                       // wind belts: trade winds (-), westerlies (+), polar easterlies (-)
  float jetV = jetCore(dir);
  float ang = uCloudPh * 0.8 + 0.2 * prof * sin(uCloudPh * 0.23 + 1.0) * uWindK + gAlt * (0.03 + 0.07 * jetV * uWindK) * (0.7 + 0.3 * sin(uCloudPh * 0.2));      // wind shear: higher slices slide past lower ones, fastest in the jets             // the belts slide past each other and back (bounded, so clouds never smear for good)
  float cs = cos(ang), sn = sin(ang);
  p = vec3(cs * p.x - sn * p.z, p.y, sn * p.x + cs * p.z);
  vec3 qp = p * 6.5 * uCloudSz;
  { float zs = 1.0 + 1.1 * jetV * uWindK;     // jet streams draw the clouds out into long streaks along the wind
    vec3 ez = normalize(vec3(-p.z, 0.0, p.x) + vec3(1e-4, 0.0, 0.0)); qp -= ez * dot(qp, ez) * (1.0 - 1.0 / zs); }
  vec3 q = qp + uNoiseOff + vec3(0.0, 0.0, uCloudPh * 0.4) + gAlt * vec3(2.9, 1.1, 3.4);   // sliding through the noise volume = clouds slowly morph; each slice of the 3D deck sits well apart in it, so the slices are different clouds (similar at large scale) and never echo each other
  float w = 0.5 + 0.9 * fbm(q * 0.5 + vec3(3.1, 1.7, 5.9), 3.0);
  float base = 0.5 + 0.9 * fbm(q + (w - 0.5) * 0.9, octf);
  float al = abs(lat), t1 = (al - 0.86 - 0.05 * sin(uCloudPh * 0.12) - 0.6 * jetMend(dir)) / 0.22, t2 = (al - 0.48) / 0.13;
  float itcz = exp(-(lat - uItcz) * (lat - uItcz) / 0.03), track = exp(-t1 * t1), belt = exp(-t2 * t2);
  float bandcover = 0.55 + 0.35 * itcz + 0.25 * track - 0.30 * belt;
  float sm = max(stormShape(dir, uStorm0), max(stormShape(dir, uStorm1), stormShape(dir, uStorm2)));
  float wxm = 0.0;
  for (int i = 0; i < 6; i++) wxm = max(wxm, wxMask(dir, i));
  wxm *= 0.55 + 0.9 * smoothstep(-0.2, 0.5, gnoise(dir * 13.0 + vec3(0.0, uCloudPh * 0.05, 3.0)));        // convective cells instead of smooth blobs
  float cov = clamp(uCloudCover * bandcover * 0.80 + sm * 0.9 + wxm * 0.8, 0.0, 1.0);
  float thr = 1.0 - cov;

  float res = max(d + sm * 0.5 + wxm * 0.35, volcAsh(dir) * 0.75);

    float ir = uCr[i].w, ia = uCrP[i].w;
    if (ir > 0.0 && ia >= 0.0 && ia < 14.0) {
      float cd = dot(dir, uCr[i].xyz);
      if (cd > 0.2) {
        float d = sqrt(max(0.0, 2.0 * (1.0 - cd))), sz = clamp(ir / 0.07, 0.25, 1.2), rr = ia * 0.10 * (1.0 + 4.0 * ir), wd = 0.03 + 0.25 * ir;

  return clamp(res, 0.0, 1.0);
}

// ------------------------------------------------------------------ rings and moon
float ringAlpha(float r) {
  float x = (r - uRingIn) / (uRingOut - uRingIn);
  if (x < 0.0 || x > 1.0) return 0.0;
  float n = 0.55 * gnoise(vec3(r * 45.0, uRingSeed, 1.0)) + 0.30 * gnoise(vec3(r * 120.0, uRingSeed, 5.0)) + 0.15 * gnoise(vec3(r * 300.0, uRingSeed, 9.0));
  float gap = (1.0 - smoothstep(0.0, 0.02, abs(x - 0.62 - 0.05 * sin(uRingSeed)))) * 0.9;
  float edge = smoothstep(0.0, 0.06, x) * (1.0 - smoothstep(0.88, 1.0, x));
  return clamp(0.55 + 0.9 * n, 0.0, 1.0) * edge * (1.0 - gap) * uRingOpa;
}

vec3 shadeMoon(vec3 hit, vec3 center, vec3 mcol, vec3 par, float bk) {         // world space; par = surface seed, mare amount, crater scale
  vec3 n = normalize(hit - center);
  vec3 q = n * par.z + par.x;
  float base = fbm(q, 5.0);
  float maria = smoothstep(par.y * 0.5 - 0.1, par.y * 0.5 + 0.15, fbm(n * 1.4 + 3.0 + par.x, 3.0));
  float e = 0.03;
  vec3 g = vec3(fbm(q + vec3(e, 0.0, 0.0), 5.0) - base, fbm(q + vec3(0.0, e, 0.0), 5.0) - base, fbm(q + vec3(0.0, 0.0, e), 5.0) - base) / e;
  vec3 nn = normalize(n - 0.12 * (g - n * dot(g, n)));
  float lam = max(dot(nn, uSunDir), 0.0);
  float sh = 1.0;                                // planet shadow (eclipse)
  vec3 ro = hit; float tb = dot(ro, uSunDir), dm = length(ro - uSunDir * tb);
  if (tb < 0.0) sh = smoothstep(0.85, 1.05, dm);
  vec3 alb = mcol * (0.55 + 0.7 * (0.5 + base) ) * mix(0.55, 1.0, maria);
  vec3 mc = pow(alb, vec3(2.2)) * (uSunColor * lam * sh * 1.7 + vec3(0.004));
  if (bk > 0.5) {                                // moon bases: a small cluster of domes by day, warm lights at night, a bright flash when a new one lands
    vec3 pd = normalize(-center), perp = normalize(cross(pd, vec3(0.0, 1.0, 0.0)) + vec3(1e-4)); float ba = 0.0;
    float nightM = 1.0 - smoothstep(-0.05, 0.12, dot(n, uSunDir));
    for (int i = 0; i < 3; i++) if (float(i) + 0.5 < bk) {
      float a = 0.28 + 0.2 * float(i), sg = i == 1 ? -1.0 : 1.0; vec3 bd = normalize(pd * cos(a) + perp * sin(a) * sg);
      float an = acos(clamp(dot(n, bd), -1.0, 1.0)), fl = (float(i) + 1.5 > bk) ? uBaseF : 0.0;
      ba += exp(-pow(an / 0.03, 2.0)) * (1.0 + 4.0 * fl) + 0.5 * exp(-pow(an / 0.10, 2.0)) * (1.0 + 2.0 * fl);
      if (an < 0.07) {                          // the settlement itself: pressurised domes in a ring around a hub, visible when zoomed in
        vec3 ex = normalize(perp - bd * dot(perp, bd)), ey = cross(bd, ex), tg = n - bd * dot(n, bd); vec2 uv = vec2(dot(tg, ex), dot(tg, ey));
        float dome = 1.0 - smoothstep(0.0062, 0.0080, length(uv));
        for (int j = 0; j < 5; j++) { float aj = float(j) * 1.2566 + float(i); dome = max(dome, 1.0 - smoothstep(0.0038, 0.0050, length(uv - 0.018 * vec2(cos(aj), sin(aj))))); }
        mc = mix(mc, vec3(0.82, 0.85, 0.9) * (0.25 + 0.9 * lam * sh) + vec3(1.0, 0.8, 0.5) * nightM * 0.6, dome);
      }
    }
    mc += vec3(1.0, 0.82, 0.5) * ba * (nightM * 2.4 + 0.5);
  }
  return mc;
}

vec3 background(vec3 rd) {
  vec3 col = vec3(0.0006, 0.0009, 0.002);
  float band = dot(rd, normalize(vec3(0.3, 0.8, 0.5)));
  vec3 sk = textureLod(uSky, vec2(atan(rd.z, rd.x) * 0.15915494 + 0.5, asin(clamp(rd.y, -1.0, 1.0)) * 0.31830989 + 0.5), 0.0).rgb;
  col += uStars * vec3(0.010, 0.012, 0.018) * exp(-band * band * 18.0) * (0.4 + 0.9 * sk.x);
  if (uNebula > 0.01) {                                                   // faint coloured gas clouds, different for every world
    float n1 = sk.y, n2 = sk.z;
    vec3 neb = mix(vec3(0.55, 0.12, 0.35), vec3(0.10, 0.30, 0.75), n2);
    col += uNebula * neb * smoothstep(0.52, 0.85, n1) * 0.04 * (0.35 + 0.65 * exp(-band * band * 6.0));
  }
  vec3 sp = rd * 150.0;
  ivec3 c = ivec3(floor(sp));
  vec3 hh = h3(c) * 0.5 + 0.5;
  if (hh.x > 0.965) {
    vec3 pos = vec3(c) + 0.5 + 0.35 * h3(c + ivec3(7, 3, 5));
    float d = length(sp - pos);
    vec3 tcol = mix(vec3(1.0, 0.78, 0.6), vec3(0.7, 0.82, 1.0), hh.y);
    col += tcol * (1.0 - smoothstep(0.0, 0.2, d)) * (0.15 + 1.6 * hh.z * hh.z * hh.z) * uStars;
  }
  if (uMeteor > 0.01) for (int k = 0; k < 9; k++) {                    // meteor shower: short bright streaks
    float tt = uTime * 0.55 + float(k) * 0.37, id = floor(tt), f = fract(tt), sd_ = id * 7.1 + float(k) * 13.3 + uNoiseOff.x * 17.0;
    vec3 rr = fract(sin(vec3(sd_, sd_ + 1.7, sd_ + 3.1) * vec3(12.9898, 78.233, 37.719)) * 43758.5453) * 2.0 - 1.0;
    vec3 s0 = normalize(rr * 0.45 + uCamFwd), t0 = normalize(cross(s0, vec3(0.0, 1.0, 0.0) + rr * 0.6));
    vec3 dv = rd - s0; float al = dot(dv, t0) / 0.2, pe = length(dv - t0 * dot(dv, t0));
    float inT = smoothstep(f - 0.3, f - 0.02, al) * (1.0 - smoothstep(f - 0.02, f + 0.02, al));
    col += vec3(0.85, 0.92, 1.0) * inT * exp(-pe * pe / 1.2e-6) * sin(3.14159 * f) * uMeteor * 2.2 * step(0.0, al);
  }

    vec3 cd = uComet.xyz, tdir = -normalize(uSunDir - cd * dot(uSunDir, cd) + vec3(1e-4)), dv = rd - cd; float u = dot(dv, tdir), pe = length(dv - tdir * u), L = 0.9 * uComet.w;
    float head = exp(-dot(dv, dv) / 6.0e-5), tl = step(0.0, u) * (1.0 - smoothstep(0.0, L, u));
    float ion = tl * exp(-pe * pe / (1.2e-4 + 4e-4 * u * u)), dust = tl * exp(-pow(pe - 0.18 * u * u, 2.0) / (1.5e-4 + 6e-4 * u * u));
    col += uComet.w * (vec3(1.0, 0.95, 0.85) * head * 2.5 + vec3(0.45, 0.7, 1.0) * ion * 2.6 * (1.0 - 0.6 * u / L) + vec3(1.0, 0.85, 0.6) * dust * 1.6 * (1.0 - 0.6 * u / L));
  }
  float sd = dot(rd, uSunDir);
  float disc = smoothstep(0.99972, 0.99982, sd);
  float glow = pow(max(sd, 0.0), 500.0) * 0.9 + pow(max(sd, 0.0), 60.0) * 0.10 + pow(max(sd, 0.0), 8.0) * 0.012;
  glow += uCine * (pow(max(sd, 0.0), 220.0) * 0.5 + pow(max(sd, 0.0), 24.0) * 0.04);
  col += uSunColor * (disc * 9.0 + glow);
  return col;
}

float plumeF(vec3 dir) {                         // how much of the ash/dust haze has reached this spot: a ragged front spreading out from each source, fading away as it ages
  float f = 0.0, w = 0.35 * gnoise(dir * 3.0 + uNoiseOff);
  for (int i = 0; i < 3; i++) { float R = uPl[i].w; if (R > 0.0 && uPlA[i] > 0.001) { float an = acos(clamp(dot(dir, uPl[i].xyz), -1.0, 1.0)) + w; f = max(f, uPlA[i] * (1.0 - smoothstep(R - 0.5, R, an))); } }
  return f * uPlK;
}

// ------------------------------------------------------------------ atmosphere (ray-marched single scattering)
vec3 atmosphere(vec3 ro, vec3 rd, vec3 sun, float tmax) {
  vec2 ta = rsi(ro, rd, RA);
  if (ta.x > ta.y) return vec3(0.0);
  float t0 = max(ta.x, 0.0), t1 = min(ta.y, tmax);
  if (t1 <= t0) return vec3(0.0);
  float H = (RA - 1.0) * 0.30;
  int NS = max(int(uAtmoQ), 6);
  float dt = (t1 - t0) / float(NS);
  float mu = dot(rd, sun);
  float pr = 0.75 * (1.0 + mu * mu);
  float g = 0.78;
  float pm = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * mu, 1.5) * 0.25;
  vec3 bet = uAtmoBeta * uAtmoDensity;
  float hz = plumeF(normalize(ro + rd * (0.5 * (t0 + t1))));      // volcanic/impact haze is local: only the sky above the ash-covered region darkens
  float mieK = (0.10 + 0.5 * hz) * uAtmoDensity;
  vec3 oz = vec3(0.65, 1.88, 0.085) * 0.45 * uAtmoDensity;      // ozone absorption: deep blue twilight
  float odR = 0.0, odM = 0.0, em = 0.0;
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 32; i++) {
    if (i >= NS) break;
    vec3 p = ro + rd * (t0 + (float(i) + 0.5) * dt);
    float hgt = max(length(p) - 1.0, 0.0);
    float rho = exp(-hgt / H), rhoM = exp(-hgt / (H * 0.4));
    odR += rho * dt; odM += rhoM * dt; em += rho * dt;
    float sd = dot(p, sun);
    float occl = sd < 0.0 ? smoothstep(0.965, 1.02, length(p - sun * sd)) : 1.0;   // soft, refracted shadow edge
    if (occl <= 0.001) continue;
    vec2 tsa = rsi(p, sun, RA);
    float dts = tsa.y / 5.0, sR = 0.0, sM = 0.0;
    for (int j = 0; j < 5; j++) {
      float hq = max(length(p + sun * ((float(j) + 0.5) * dts)) - 1.0, 0.0);
      sR += exp(-hq / H) * dts; sM += exp(-hq / (H * 0.4)) * dts;
    }
    vec3 T = exp(-(bet * (odR + sR) + vec3(mieK * 1.1) * (odM + sM) + oz * (odR + sR) * 0.6));
    vec3 sc = bet * rho * pr + vec3(mieK * rhoM * pm * 4.0);
    acc += T * sc * dt * occl;
  }
  vec3 ar = acc * uSunColor * uAtmoGain * (1.0 + 1.4 * uCine) * (1.0 - 0.8 * hz);
  ar = mix(ar, vec3(dot(ar, vec3(0.3, 0.5, 0.2))) * 0.55, 0.85 * hz);
  return ar + vec3(1.0, 0.40, 0.12) * uHot * em * 0.9;
}

vec3 aurora(vec3 ro, vec3 rd, vec3 sun, float tmax) {
  vec2 ts = rsi(ro, rd, 1.055);
  if (ts.x > ts.y) return vec3(0.0);
  float t0 = max(ts.x, 0.0), t1 = min(ts.y, tmax);
  if (t1 <= t0) return vec3(0.0);
  vec3 mag = normalize(vec3(0.12, 1.0, 0.08));
  vec3 e1 = normalize(cross(mag, vec3(0.0, 0.0, 1.0))), e2 = cross(mag, e1);
  int NS = max(int(uAurQ), 6);
  float dt = (t1 - t0) / float(NS);
  float jit = hash13(vec3(gl_FragCoord.xy, 3.0 + uJi));
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 48; i++) {
    if (i >= NS) break;
    vec3 p = ro + rd * (t0 + (float(i) + jit) * dt);
    float r = length(p), alt = clamp((r - 1.0) / 0.055, 0.0, 1.0);
    vec3 n = p / r;
    float ml = abs(dot(n, mag));
    float az = atan(dot(n, e2), dot(n, e1));
    float warp = 0.45 * gnoise(vec3(az * 1.6, alt * 0.8, uTime * 0.03)) + 0.18 * gnoise(vec3(az * 4.5, 2.0, uTime * 0.06));      // folds in the curtain, so it is never a clean ring
    float az2 = az + warp;
    float c = 0.925 + 0.018 * sin(az * 3.0 + uTime * 0.1) + 0.012 * gnoise(vec3(az * 2.2, 4.0, uTime * 0.02));
    float wid = 0.026 + 0.018 * (0.5 + 0.5 * gnoise(vec3(az * 2.0, 9.0, 0.0)));
    float band = exp(-pow((ml - c) / wid, 2.0));
    float curtain = smoothstep(-0.35, 0.55, 0.5 + 1.0 * gnoise(vec3(az2 * 2.5 + uTime * 0.07, 1.0, uTime * 0.05)));          // bright patches and dark gaps
    float viewAl = 1.0 - pow(abs(dot(rd, n)), 3.0);                                                                       // looking straight down a ray: no spoke-like striations
    float rn = 0.45 * gnoise(vec3(az2 * 11.0, alt * 1.5, uTime * 0.25)) + 0.55 * gnoise(vec3(az2 * 31.0, alt * 2.5, uTime * 0.4));
    float rays = mix(1.0, 0.68 + 0.62 * rn, viewAl);
    float vert = smoothstep(0.0, 0.10, alt) * exp(-alt * 2.4);
    float night = 1.0 - smoothstep(-0.15, 0.25, dot(n, sun));
    float pulse = 0.78 + 0.22 * sin(uTime * 0.7 + az * 3.0 + 2.0 * gnoise(vec3(az, 5.0, uTime * 0.1)));
    vec3 col = mix(uAuroraLo, uAuroraHi, smoothstep(0.30, 0.85, alt));
    col = mix(col, uAuroraLo * vec3(0.6, 1.1, 1.3), 0.25 * smoothstep(-0.3, 0.5, gnoise(vec3(az * 2.0, 3.0, 1.0))));
    acc += col * band * curtain * rays * vert * night * pulse * dt;
  }
  return acc * uAurora * 22.0;
}

// ------------------------------------------------------------------ planet surface
float localTemp(vec3 p, float hl, float e) {                    // surface temperature (deg C) at a point: latitude, altitude, oceans moderate it
  float T = mix(uTs + uEqD, uTs - uPoD, pow(abs(p.y), 1.5)) - 38.0 * hl + 4.0 * gnoise(p * 3.0 + uNoiseOff);
  return (e < 0.0 ? mix(T, uTs, 0.35) : T) + uSeas * p.y * (e < 0.0 ? 0.5 : 1.0) + uClimK * climA(p).r;     // seasons: the summer hemisphere warms, the winter one cools (oceans less); plus today's day/night, wind and current anomaly
}
float rainClimate(vec3 p, float hl) {                           // long-term wetness 0..1 (ITCZ, storm tracks, dry subtropics, mountains)
  float wetB = clamp(0.55 + uWet * 0.5, 0.05, 1.0);
  float itcz = exp(-(p.y - uItcz) * (p.y - uItcz) / 0.03), track = exp(-pow((abs(p.y) - 0.75) / 0.2, 2.0)), dry = exp(-pow((abs(p.y) - 0.47) / 0.13, 2.0));            // storm tracks near 49 deg, the dry subtropical belt near 28 deg
  float n = 0.5 + 0.5 * fbm(p * 3.0 + uNoiseOff + vec3(7.0, 2.0, 4.0), 3.0);
  return clamp(wetB * (0.25 + 0.65 * itcz + 0.45 * track - 0.3 * dry) * (0.7 + 0.6 * n) + 0.25 * hl * wetB, 0.0, 1.0);
}
float precipNow(vec3 p, float hl) {                             // rain falling right now: dense cloud, wet climate and storm cores
  float cd = cloudDensity(p, 4.0);
  float sm = max(stormMask(p, uStorm0), max(stormMask(p, uStorm1), stormMask(p, uStorm2)));
  float r = smoothstep(0.55, 1.0, cd) * rainClimate(p, hl) * 0.55 + sm * smoothstep(0.2, 0.7, cd) * (0.9 + 0.3 * uThunder);       // ordinary rain only in the wet belts; the heavy rain is under the storms
  float wr = 0.0;
  for (int i = 0; i < 6; i++) wr = max(wr, wxMask(p, i) * uWxP[i].z);
  r = max(r, wr);
  return clamp(r, 0.0, 1.0) * (1.0 - uMagma) * (1.0 - smoothstep(300.0, 700.0, uTs));
}
float snowDepthCm(vec3 p, float hl, float T) {
  float cold = (1.0 - smoothstep(-12.0, 1.0, T));
  return 400.0 * pow(cold * (0.25 + 0.75 * rainClimate(p, hl)), 1.15) * (1.0 + 2.0 * (1.0 - smoothstep(-45.0, -18.0, T)));
}

vec3 shadePlanet(vec3 p, vec3 rd, float t, vec3 sun, float pixAng, vec3 moonP) {
  float px = max(t * pixAng, 1e-6);
  float octf = clamp(log2(1.0 / (px * 1.5)) - 0.3 + uOct, 2.0, 10.5);
  PInfo pi = plateInfo(p);
  float h0 = terrain(p, pi, octf);
  vec3 T1 = normalize(cross(p, abs(p.y) < 0.95 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
  vec3 T2 = cross(p, T1);
  float eps = max(px * 1.2, 2.0e-4);
  float hx = terrain(normalize(p + T1 * eps), pi, octf);
  float hy = terrain(normalize(p + T2 * eps), pi, octf);
  vec3 N = normalize(p - RELIEF * ((hx - h0) / eps * T1 + (hy - h0) / eps * T2));

  // volcanic cracks along plate boundaries on hot worlds
  float vol = uGlow;
  float crack = 0.0;
  if (vol > 0.001) crack = (1.0 - smoothstep(0.0, 0.012 + 0.03 * vol, abs(pi.gap))) * vol * (0.4 + 0.6 * smoothstep(0.1, 0.6, abs(pi.conv)));

  Surf s = biome(p, h0, crack, px);
  float vdark = 0.0, vglow = 0.0;
  for (int i = 0; i < NV; i++) {
    float cd = dot(p, uVSite[i]);

  if (uRingOn > 0.5 && abs(sun.y) > 1e-3) {                       // ring shadow
    float tr = -p.y / sun.y;
    if (tr > 0.0) { vec3 hp = p + sun * tr; shadow *= 1.0 - 0.9 * ringAlpha(length(hp.xz)); }
  }

  float ao = 0.72 + 0.28 * smoothstep(0.0, 0.35, s.hl);
  float ambient = (0.025 + 0.14 * smoothstep(-0.3, 0.5, ndl0)) * ao;
  vec3 col = alb * (sunlight * lambert * shadow + uAtmoCol * ambient);
  float flicker = 0.88 + 0.12 * sin(uTime * 1.7 + p.x * 400.0 + p.y * 300.0);
  col += alb * s.emis * 2.2 * flicker;
  col += vec3(1.0, 0.28, 0.06) * vglow * 3.5 * (0.85 + 0.15 * flicker);
  { vec3 cf = craterFx(p); col += vec3(1.0, 0.32, 0.07) * cf.x * 1.8 * (0.85 + 0.15 * flicker) + vec3(1.0, 0.8, 0.5) * cf.z; }
  { float nF = 1.0 - smoothstep(-0.06, 0.12, ndl0); col += pow(uBio[4], vec3(2.2)) * 0.9 * s.bio * uBioGlow * nF * (0.8 + 0.2 * sin(uTime * 0.8 + p.x * 30.0)); }   // bioluminescence
  if (uBioLum > 0.01) { float nL = 1.0 - smoothstep(-0.10, 0.18, ndl0);                                    // luminous worlds: living veins of light on the land, glowing seas along the coasts, slow pulses rolling across the planet
    if (nL > 0.01) { vec3 gc = pow(uBioC, vec3(2.0));
      float pulse = 0.62 + 0.38 * sin(uTime * 0.55 + dot(p, vec3(3.1, 5.3, 2.2)) * 7.0 + gnoise(p * 9.0) * 3.0);
      float vein = smoothstep(0.35, 0.95, 1.0 - abs(gnoise(p * 70.0))), vein2 = smoothstep(0.5, 0.95, 1.0 - abs(gnoise(p * 210.0 + 4.0))), lpat = smoothstep(0.35, 0.8, gnoise(p * 11.0) * 0.5 + 0.5);
      float land = s.bio * (0.2 + 1.1 * vein * (0.5 + 0.5 * lpat) + 0.8 * vein2 * clamp(0.02 / px, 0.0, 1.0) + 0.5 * lpat);

    float reg = fbm(p * 9.0 + uNoiseOff * 3.0, 4.0), rtL = 0.0;
    float pop = smoothstep(0.05, 0.45, reg * 0.9 + 0.35 * (1.0 - s.hl * 1.6) - 0.12);
    float f = clamp(1.0 / (px * 3.0), 40.0, 4000.0);
    float cell = gnoise(p * f) * 0.5 + 0.5;
    float cm = uCivAll;
    for (int i = 0; i < 8; i++) { if (uCivP[i].x > 0.0) { float d2 = 2.0 * (1.0 - clamp(dot(p, uCiv[i].xyz), -1.0, 1.0)); cm = max(cm, uCivP[i].x * exp(-d2 / (uCiv[i].w * uCiv[i].w))); } }
    pop *= smoothstep(0.02, 0.35, cm);
    { vec2 ruv2 = vec2(fract(atan(p.z, p.x) * 0.15915494), 0.5 - asin(clamp(p.y, -1.0, 1.0)) * 0.31830989); float lod2 = clamp(log2(max(px, 1e-5) / 0.0031), 0.0, 8.0);
      vec4 rt = mix(textureLod(uRiv1, ruv2, lod2 + 2.0), textureLod(uRiv0, ruv2, lod2 + 2.0), uRivF);
      pop = clamp(pop + 0.4 * clamp(rt.r * 3.0, 0.0, 1.0) * uRivK + 0.25 * (1.0 - smoothstep(0.0, 0.1, s.hl)), 0.0, 1.0);          // people settle along rivers and coasts
      rtL = mix(textureLod(uRiv1, ruv2, lod2), textureLod(uRiv0, ruv2, lod2), uRivF).b * uRoadK; }
    float spots = smoothstep(0.66 - 0.28 * pop, 0.92, cell);
    float haze = pop * pop * 0.10 + pop * 0.02;
    vec3 lc = mix(vec3(1.0, 0.55, 0.2), vec3(1.0, 0.88, 0.62), hash13(floor(p * f)));
    float rLit = smoothstep(0.55, 0.95, rtL), bead = smoothstep(0.30, 0.70, gnoise(p * f * 0.55) * 0.5 + 0.5);
    col += lc * rLit * (0.25 + 1.1 * bead) * uCity * nightF * 1.7 * (1.0 + 1.0 * uCine);                    // street lights strung along the roads
    col += lc * (spots * pop * 1.5 + haze) * uCity * smoothstep(0.0, 0.6, cm) * nightF * 1.8 * (1.0 + 1.0 * uCine) * (0.9 + 0.1 * sin(uTime * 3.0 + cell * 40.0));
  }
  for (int i = 0; i < 24; i++) {                                                 // ships on the sea lanes and caravans on the roads
    if (i >= uMovN) break; float cdm = dot(p, uMov[i].xyz); if (cdm < 0.99985) continue;
    float dm = sqrt(max(0.0, 2.0 * (1.0 - cdm))), ship = step(0.0, uMov[i].w), lit = abs(uMov[i].w), core = exp(-pow(dm / (0.0011 + 0.0006 * ship), 2.0)), wake = exp(-pow(dm / 0.0028, 2.0)) * ship;
    col = mix(col, vec3(0.95, 0.96, 0.98), clamp(core * (1.0 - nightF) * 0.9 + wake * (1.0 - nightF) * 0.28, 0.0, 0.95));

  }

  vec3 V = -rd;
  vec3 Hh = normalize(sun + V);
  float day = smoothstep(0.0, 0.2, ndl0);
  float glint = pow(max(dot(Nw, Hh), 0.0), 260.0) * s.ocean * day * 3.0;
  float fres = pow(1.0 - max(dot(Nw, V), 0.0), 5.0) * s.ocean * 0.8;

  col += sunlight * pow(max(dot(Nw, Hh), 0.0), 14.0) * s.ocean * day * pow(1.0 - max(dot(p, V), 0.0), 3.0) * 0.45 * shadow;      // broad sheen of reflected sun on the sea, strongest at grazing angles (Fresnel)
  col += uAtmoCol * fres * (0.05 + 0.5 * smoothstep(-0.2, 0.5, ndl0));
  return col;
}

vec3 gFlash = vec3(0.0);
const vec3 THC[7] = vec3[7](vec3(0.72, 0.84, 1.0), vec3(0.45, 1.0, 0.80), vec3(1.0, 0.66, 0.90), vec3(0.88, 0.40, 1.0), vec3(1.0, 0.93, 0.30), vec3(0.62, 1.0, 0.45), vec3(1.0, 0.46, 0.14));      // air, oxygen, CO2, methane, sulfur, ammonia, fire
vec3 thunderCol(float rr, vec3 c) {              // which gas does this bolt ionise? weighted by what the air is made of
  float tot = 0.0; for (int i = 0; i < 7; i++) tot += uThuW[i];
  float r = fract(rr * 12.9898 + 0.37) * max(tot, 1e-3), a = 0.0; vec3 col = THC[0];
  for (int i = 0; i < 7; i++) { a += uThuW[i]; if (r <= a) { col = THC[i]; break; } }

}
vec3 lightning(vec3 cp, float dens) {
  vec4 sts[3] = vec4[3](uStorm0, uStorm1, uStorm2);
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 3; i++) {
    float sw = abs(sts[i].w);
    if (sw < 0.05) continue;
    for (int k = 0; k < 2; k++) {
      float tt = uTime * (1.3 + 0.5 * float(k)) + float(i * 7 + k * 13) * 1.7;
      float cell = floor(tt), f = fract(tt);
      float rr = hash13(vec3(cell, float(i), float(k) + 3.0));

        vec3 c = normalize(sts[i].xyz + 0.22 * h3(ivec3(int(cell), i, k + 11)));
        float dd = acos(clamp(dot(cp, c), -1.0, 1.0));
        float flash = exp(-f * 7.0) * (0.55 + 0.45 * step(0.5, fract(f * 9.0 + rr * 5.0)));

        acc += flash * sw * (mix(vec3(1.0), col, 0.75) * exp(-dd * dd / 0.0012) + col * exp(-dd * dd / 0.012) * 0.45);       // white-hot core, coloured glow
      }

  for (int i = 0; i < 6; i++) {                                    // thunderstorms: superstorms and storm clusters flash from several spots inside their cloud mass
    float ty = uWxP[i].x; if (!(abs(ty - 3.0) < 0.5 || abs(ty - 7.0) < 0.5)) continue;
    float sw = uWx[i].w; if (sw < 0.15) continue;

    for (int k = 0; k < 3; k++) {
      float tt = uTime * (1.1 + 0.4 * float(k)) + float(i * 5 + k * 11) * 1.3, cell = floor(tt), f = fract(tt);
      float rr = hash13(vec3(cell, float(i) + 20.0, float(k) + 5.0));
      if (rr > 0.5) {
        vec3 c = normalize(uWx[i].xyz + R * 1.1 * h3(ivec3(int(cell), i + 30, k + 17)));
        float dd = acos(clamp(dot(cp, c), -1.0, 1.0));
        float flash = exp(-f * 7.0) * (0.55 + 0.45 * step(0.5, fract(f * 9.0 + rr * 5.0)));
        vec3 col = thunderCol(rr, c);
        acc += flash * sw * (mix(vec3(1.0), col, 0.75) * exp(-dd * dd / 0.0012) + col * exp(-dd * dd / 0.012) * 0.45);

float cirrusA(vec3 cp, float px, float d) {      // high, wispy cirrus streaks drifting faster than the main deck; they ride the jet streams
  if (!(uCloudCover > 0.05 && px < 0.01)) return 0.0;

  float cn = 0.5 + 0.9 * fbm(vec3(cr.x * 3.2, cr.y * 7.0 + jm * 7.0, cr.z * 3.2) + uNoiseOff * 1.7 + vec3(4.0, 0.0, 9.0), 3.0);
  return smoothstep(0.50, 0.85, cn) * (0.15 + 0.35 * uCloudCover) * (0.4 + 0.6 * exp(-pow((abs(cp.y) - 0.5) / 0.4, 2.0))) * (0.7 + 0.9 * jetCore(cp) * uWindK) * (1.0 - 0.8 * smoothstep(0.3, 0.9, d)) * 0.5;
}
vec4 cirrusShade(vec3 cp, vec3 sun, float px) {  // the highest level of the 3D deck: thin ice streaks well above the cumulus

  vec3 trans = exp(-uAtmoBeta * uAtmoDensity * max(air - 0.9, 0.0) * 0.55), sunlight = uSunColor * trans * 1.5 * (1.0 - 0.5 * plumeF(cp));

}
vec4 shadeCloud(vec3 cp, vec3 sun, vec3 vd, float px, float f) {     // f < 0: the classic single sheet; f in 0..1: one slice of the 3D deck (0 = flat grey base, 1 = sunlit towers)

      float d1 = cloudDensity(normalize(cp + sd * off), min(coct, 3.0));

      if (uHQ > 0.5) od += max(cloudDensity(normalize(cp + sd * off * 5.0), 2.0) - d * 0.2, 0.0) * 0.9;      // a third, longer tap toward the sun: deeper, softer shadows inside big cloud decks

  for (int i = 0; i < 6; i++) tint = mix(tint, pow(uWxC[i], vec3(2.2)), clamp(wxMask(cp, i) * 1.6, 0.0, 0.92));

// ---- cutaway map: a corner of the planet is removed and the layers are painted on the three cut faces ----
vec3 cutDir(vec3 cb, vec3 cr, vec3 cu, float a) { return normalize(cb * 0.577 + (cos(a) * cr + sin(a) * cu) * 0.816); }
bool inOct(vec3 p, vec3 e0, vec3 e1, vec3 e2) { return dot(p, e0) > 0.0 && dot(p, e1) > 0.0 && dot(p, e2) > 0.0; }
vec3 cutShade(vec3 q, int fi) {
  float r = length(q); vec3 d = q / r;
  float fs = fi == 0 ? 1.0 : (fi == 1 ? 0.87 : 0.75);
  PInfo pr = plateInfo(d); float h = terrain(d, pr, 2.0);
  float lnd = smoothstep(-0.03, 0.10, h - uSea);                       // continental vs oceanic column
  float wd = (uOcean > 0.5 && h < uSea) ? clamp(0.008 + (uSea - h) * 0.05, 0.008, 0.05) : 0.0;
  float ct = mix(0.013, 0.045, lnd) + max(h - uSea, 0.0) * 0.03;      // continental crust is thick, oceanic thin (exaggerated ~3x)
  float rTop = 1.0 - wd, rBase = max(rTop - ct, 0.91), rM = 0.895, rO = uCoreR, rI = uInnerR;
  float bd = min(min(abs(r - rBase), abs(r - rM)), min(abs(r - rO), abs(r - rI)));
  if (wd > 0.0) bd = min(bd, abs(r - rTop));
  float n = fbm(d * 2.6 + vec3(r * 1.9), 3.0);
  vec3 c;
  if (r > rTop) {                                                       // ocean
    float s = (1.0 - r) / max(wd, 1e-3);
    c = pow(mix(uWSh, uWDp, clamp(s * 1.2, 0.0, 1.0)), vec3(0.62)) * 1.15;
  } else if (r > rBase) {                                               // crust, with sedimentary strata
    float s = (rTop - r) / max(ct, 1e-3);
    float b = 0.5 + 0.5 * sin(s * 34.0 + 5.0 * fbm(d * 6.0, 2.0) + 3.0 * n);
    vec3 granite = mix(vec3(0.62, 0.56, 0.47), vec3(0.36, 0.33, 0.32), b * 0.8 + s * 0.3);
    vec3 basalt = mix(vec3(0.23, 0.25, 0.29), vec3(0.12, 0.13, 0.16), b * 0.7 + s * 0.4);
    c = mix(basalt, granite, lnd);
    if (s < 0.1 && wd == 0.0) c = mix(vec3(0.30, 0.23, 0.14), vec3(0.20, 0.42, 0.16), clamp(uLife * 2.0, 0.0, 1.0));            // topsoil, green where life has spread
    if (s < 0.05 && wd > 0.0) c = mix(c, vec3(0.55, 0.50, 0.40), 0.5);   // sea-floor sediment
  } else if (r > rO) {                                                  // mantle (upper above 0.895, lower below)
    float t = r > rM ? (r - rM) / max(rBase - rM, 1e-3) : (r - rO) / max(rM - rO, 1e-3);
    vec3 up = mix(vec3(0.98, 0.46, 0.11), vec3(0.58, 0.16, 0.07), t);
    vec3 lo = mix(vec3(0.97, 0.30, 0.08), vec3(0.70, 0.17, 0.08), t) * vec3(1.0, 0.92, 1.0);
    c = (r > rM ? up : lo) * (0.72 + 0.62 * (n + 0.5)) * (0.8 + 0.3 * uCutHeat);
    float pl = 0.0;
    for (int i = 0; i < NV; i++) if (uVGrow[i] > 0.001) {              // hot-spot plumes rise under active volcanoes
      float ang = acos(clamp(dot(d, uVSite[i]), -1.0, 1.0));
      pl += uVAct[i] * smoothstep(0.1, 0.5, uVGrow[i]) * exp(-pow(ang / (0.045 + 0.05 * (1.0 - r)), 2.0));
    }
    { float dep = max(rBase - r, 0.0), slab = max(pr.conv, 0.0) * exp(-pow((abs(pr.gap) - dep * 0.8) / 0.06, 2.0)) * (1.0 - smoothstep(0.22, 0.34, dep)) * smoothstep(0.0, 0.02, dep);      // cold oceanic plates sinking into the mantle at the subduction zones
      c = mix(c, vec3(0.20, 0.34, 0.70) * (0.8 + 0.4 * n), clamp(slab * 1.2, 0.0, 0.9)); }
    c += vec3(1.0, 0.72, 0.28) * clamp(pl, 0.0, 1.0) * smoothstep(rO, rO + 0.06, r) * 0.9;
  } else if (r > rI) {                                                  // liquid outer core, churning
    float t = (r - rI) / max(rO - rI, 1e-3);
    c = mix(vec3(1.0, 0.74, 0.28), vec3(0.97, 0.44, 0.10), t);
    c *= 0.84 + 0.16 * sin(r * 70.0 + 9.0 * fbm(d * 3.0, 3.0)) + 0.1 * n;
    c *= 0.85 + 0.25 * uCutHeat;
  } else {                                                              // solid inner core
    c = vec3(1.0, 0.95, 0.76) * (0.94 + 0.12 * n) * (0.9 + 0.15 * uCutHeat);
  }
  c = mix(c, c * 0.2, 0.85 * (1.0 - smoothstep(0.0012, 0.0042, bd)));   // thin dark lines between layers
  c += vec3(0.5, 0.5, 0.55) * smoothstep(0.993, 1.0, r) * 0.18;          // bright rim where the cut meets the surface
  return clamp(c * fs, 0.0, 1.0);
}

void main() {
  if (uBake > 0.5) {                                              // one-off bake of the smooth sky noise (milky-way band + two nebula fields) so the sky costs a texture lookup, not 11 noise octaves per pixel

function layoutCenter(snap) {                       // keep the planet centred in the part of the screen the panels leave free

  let L = 0, R = W, T = 0, B = H;
  if (!body.classList.contains("hide")) {
    const lc = $("leftcol"), sd = $("side"), bt = $("bottom"), tb = $("topbar"), lg = $("legend");
    if (vis(lc)) L = lc.getBoundingClientRect().right + 12;
    if (vis(sd) && !sd.classList.contains("closed")) R = sd.getBoundingClientRect().left - 12;
    { const mp = $("maps"); if (vis(mp) && !mp.classList.contains("closed") && !document.body.classList.contains("mobile")) R = Math.min(R, mp.getBoundingClientRect().left - 12); }
    if (vis(bt)) B = bt.getBoundingClientRect().top - 10;
    T = (vis(lg) ? lg.getBoundingClientRect().bottom : vis(tb) ? tb.getBoundingClientRect().bottom : 0) + 8;
  }
  if (R - L < 260) { L = 0; R = W; }
  if (B - T < 200) { T = 0; B = H; }
  S.shiftT = [((L + R) / 2 - W / 2) / (H / 2) + (S.ux || 0), -((T + B) / 2 - H / 2) / (H / 2) + (S.uy || 0)];
  if (WP.on && WP.shift) S.shiftT = [WP.shift[0] * Math.min(1, W / H / 1.6), WP.shift[1]];       // wallpaper mode: cinematic off-centre framing, the planet cropped into a corner
  if (snap) S.shift = S.shiftT.slice();
}

  const fi = W.formInfo(n, S.age), T = W.tree, par = n.parent >= 0 ? T[n.parent] : null, kids = T.filter(k => k.parent === T.indexOf(n)), h = HABI[n.hab] || HABI.sea, col = "#" + hsl2rgb(n.hue, 0.85, 0.62).map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
  const cls = fi.dead ? "bad" : fi.status === "Endangered" ? "bad" : fi.status === "Declining" ? "mid" : "";
  setHTML(el, `<div style="display:flex;gap:10px;align-items:flex-start">${critSVG(n, 84)}<div><h3 style="color:${col}">${h[0]} ${n.name}<span class="st ${cls}">${fi.status}</span></h3><div>${n.note}</div></div></div><div class="fg">`
    + `<div><b>Habitat</b>${h[1]}</div><div><b>Diet</b>${n.diet}</div><div><b>Typical size</b>${fmtSz(n.size)}</div><div><b>Comfortable climate</b>${n.tmin.toFixed(0)} to ${n.tmax.toFixed(0)} °C</div>`
    + `<div><b>${fi.dead ? "Lived" : "Appeared"}</b>${fi.dead ? ((n.died - n.born) * 2).toFixed(0) + " Myr" : ((S.age - n.born) * 2).toFixed(0) + " Myr ago"}</div><div><b>Origin</b>${llOf(n.o)}</div><div><b>Range</b>${fi.km.toFixed(0)} km radius</div>`
    + `<div><b>Population (est.)</b>${fi.dead ? "none" : fmtN(fi.pop)}</div><div><b>Descended from</b>${par ? par.name : "first life"}</div><div><b>Offspring lines</b>${kids.length ? kids.map(k => k.name).join(", ") : "none yet"}</div>`
    + (fi.dead ? `<div><b>Died out</b>${((S.age - n.died) * 2).toFixed(0)} Myr ago</div><div><b>Cause</b>${n.cause || "unknown"}</div>` : `<div><b>Climate fit</b>${Math.round(fi.fit * 100)}%</div>`) + `</div><button id="fcGo">Show on globe</button>`);

function probeLand(dirs) {            // returns [{land, w}] per direction (land = height above sea level), or null if the GPU query isn't available
  try {
    if (!prog || !S.world || !dirs.length || dirs.length > 24) return null;
    const W = S.world, p = W.params(S.age), t = target("probe", 24, 1), flt = new Float32Array(72);
    dirs.forEach((d, i) => flt.set(d, i * 3));
    gl.useProgram(prog); gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo); gl.viewport(0, 0, 24, 1);
    setUniforms(W, p, 24, 1); u1("uProbe", 1); gl.uniform3fv(L("uProbeDir[0]"), flt);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const buf = new Uint8Array(24 * 4); gl.readPixels(0, 0, 24, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    u1("uProbe", 0); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return dirs.map((_, i) => ({ land: (buf[i * 4] / 255 - 0.5) / 2, w: buf[i * 4 + 1] / 255 }));
  } catch (e) { try { u1("uProbe", 0); gl.bindFramebuffer(gl.FRAMEBUFFER, null); } catch (x) {} return null; }
}

function updatePins(W) {
  const seen = new Set(), c = S.cam, th = Math.tan(0.5 * S.fov * Math.PI / 180), hh = innerHeight / 2;
  if (S.pins && c && !S.view) for (const v of W.civs) {
    if (v.pop < 1000) continue;
    const Pw = mulMV(transpose(S.M), W.civPos(v)), vis = dot3(Pw, c.cp) > 1.0;
    let el = pinEls.get(v); if (!el) { el = mk("div", "pin", `<div class="lbl"></div><div class="stem"></div><div class="dot"></div>`); el.firstChild.onclick = () => openStory(v); el.firstChild.title = "Click to read this nation's story"; $("pins").appendChild(el); pinEls.set(v, el); }
    seen.add(v);
    const d = [Pw[0] - c.cp[0], Pw[1] - c.cp[1], Pw[2] - c.cp[2]], z = dot3(d, c.fwd);
    if (!vis || z <= 0) { el.style.display = "none"; continue; }
    el.style.display = "block";
    const x = innerWidth / 2 + (dot3(d, c.right) / z / th + S.shift[0]) * hh, y = hh - (dot3(d, c.up) / z / th + S.shift[1]) * hh;
    el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
    el.firstChild.style.borderColor = ERAS[eraIdx(v.tech)][2];
    setHTML(el.firstChild, `${flagSVG(v.flag, 20)} ${civTitle(v)}<small>${fmtPop(v.pop)} · ${ERAS[eraIdx(v.tech)][1]} ${civEra(v.tech)}${v.base ? " · 🌙 moon base" : ""}${v.asc ? " · ✦ Ascendant" : ""}</small>${v.war ? `<span class="wr">⚔ at war with ${v.war.foe.name}</span>` : ""}`);
  }
  for (const [v, el] of pinEls) if (!seen.has(v)) { el.remove(); pinEls.delete(v); }
  updateLifePins(W);
}

/* ------------------------------------------------------------------ title screen */
const TITLE = { on: false, sel: 0 };
{
  const T = document.getElementById("title"), tbtns = [...T.querySelectorAll(".tmenu button")];
  const skip = WP.on || !!RESTORED || ["seed", "age", "notitle", "wallpaper", "ov"].some(k => Q.has(k));
  if (skip) { T.classList.add("off"); }
  else {
    TITLE.on = true; document.body.classList.add("intitle"); T.querySelector(".tbg").style.backgroundImage = "url(" + TITLE_IMG + ")"; $("tseed").textContent = "backdrop: a world forged by Planet Forge";
    const cv = $("tdust"), g = cv.getContext("2d"); let dots = [], tw = 0, th = 0;
    const fit = () => { tw = cv.width = innerWidth; th = cv.height = innerHeight; dots = Array.from({ length: 70 }, () => ({ x: Math.random() * tw, y: Math.random() * th, r: Math.random() * 1.6 + 0.3, v: Math.random() * 0.25 + 0.05, a: Math.random() * 6.28, h: Math.random() < 0.3 ? "255,190,130" : "170,200,255" })); }; fit(); addEventListener("resize", fit);
    (function dust() { if (!TITLE.on) return; g.clearRect(0, 0, tw, th); for (const d of dots) { d.x += d.v; d.y -= d.v * 0.35; d.a += 0.02; if (d.x > tw + 4) d.x = -4; if (d.y < -4) d.y = th + 4; g.fillStyle = `rgba(${d.h},${(0.25 + 0.35 * Math.sin(d.a)).toFixed(2)})`; g.beginPath(); g.arc(d.x, d.y, d.r, 0, 6.283); g.fill(); } requestAnimationFrame(dust); })();
    const pick = i => { TITLE.sel = (i + tbtns.length) % tbtns.length; tbtns.forEach((b, k) => b.classList.toggle("sel", k === TITLE.sel)); };
    const act = a => {
      if (a === "start") { if (T.classList.contains("go")) return; T.classList.add("go"); TITLE.on = false; document.body.classList.remove("intitle"); newWorld(); S.frozen = false; setTimeout(() => T.classList.add("off"), 1000); }
      else if (a === "settings") { TITLE.settings = true; toggleGfx(); }
      else if (a === "quit") { T.classList.add("bye"); TITLE.on = false; try { if (window.pfApp && window.pfApp.quit) window.pfApp.quit(); else window.close(); } catch (e) {} }
    };
    tbtns.forEach((b, k) => { b.addEventListener("mouseenter", () => pick(k)); b.addEventListener("click", () => act(b.dataset.a)); });
    addEventListener("keydown", e => { if (!TITLE.on || $("gfx").classList.contains("open")) return; const k = e.key;
      if (k === "ArrowDown" || k === "s" || k === "S") pick(TITLE.sel + 1); else if (k === "ArrowUp" || k === "w" || k === "W") pick(TITLE.sel - 1); else if (k === "Enter" || k === " ") act(tbtns[TITLE.sel].dataset.a); else if (k === "Escape") return;
      e.stopImmediatePropagation(); e.preventDefault(); }, true);
  }
}
